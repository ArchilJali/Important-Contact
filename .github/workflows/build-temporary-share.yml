name: Build temporary no-login files
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_temporary_share.py'
      - 'temporary-share/offline-adapter.js'
      - '.github/workflows/build-temporary-share.yml'
permissions:
  contents: write
concurrency:
  group: temporary-share-build
  cancel-in-progress: false
jobs:
  build-files:
    if: github.repository == 'ArchilJali/Important-Contact' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Build local copies from approved source
        run: python3 scripts/build_temporary_share.py
      - name: Check scope and generated manifest
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('veterinary/temporary-share')
          m=json.loads((p/'BUILD.json').read_text())
          assert not m['authentication'] and not m['online_deployment'] and not m['automatic_sync']
          assert m['source_seed_sha256'] == hashlib.sha256(pathlib.Path('veterinary/data/snapshot.json').read_bytes()).hexdigest()
          for name,digest in m['files'].items():
              assert '/' not in name and name.endswith('.html')
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest
          PY
      - name: Save only the generated copies to this private repository
        run: |
          git config user.name 'Important Contact Local Copy Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veterinary/temporary-share/Important-Contact-*.html veterinary/temporary-share/BUILD.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate temporary no-login contact review files; no online deployment'
          git push origin HEAD:main
