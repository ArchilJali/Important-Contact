name: Deploy Important Contact GitHub Pages preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'veterinary/data/oxyglobin-authors-institutions.json'
      - '.github/workflows/pages-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: important-contact-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'ArchilJali/Important-Contact'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare self-contained site data
        run: |
          mkdir -p site/data
          cp veterinary/data/oxyglobin-authors-institutions.json site/data/oxyglobin-authors-institutions.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Important Contact site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
